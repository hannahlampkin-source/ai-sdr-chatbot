
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PipelineIQ | AI SDR Demo</title>
<link rel="stylesheet" href="style.css"></head>

<body>

  <h1>Welcome to PipelineIQ</h1>

  <p>
    Turn website visitors into qualified sales opportunities.
  </p>

  <div id="chatbot">

    <h2>Chat with our sales assistant</h2>

    <p>
      Hi! Welcome to PipelineIQ.
      How can I help you today?
    </p>

  <button id="demo-btn">Book a demo</button>
  <button id="explore-btn">Explore solutions</button>  
  <p id="chat-response"></p>
  <div id="qualification-options"></div>
  <form id="lead-form" hidden>
  <label for="visitor-name">Name (optional)</label>
  <input
    type="text"
    id="visitor-name"
    name="visitorName"
    autocomplete="name"
  >
    <label for="visitor-email">Work email (optional)</label>
  <input
    type="email"
    id="visitor-email"
    name="visitorEmail"
    autocomplete="email"
  >
  <button type="submit">Submit details</button>
</form>
  </div>
<script src="script.js"></script>
</body>
</html>
